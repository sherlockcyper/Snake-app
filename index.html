<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14532d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>لعبة الثعبان ثلاثية الأبعاد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#cfeec0;--ink:#14532d;--edge:#14532d;--btn:#ffb703;--btnink:#5a3200;--btnsh:#c27a00;--card:#ffffffb0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2616;--ink:#d9ffd0;--edge:#0b3d1f;--card:#ffffff1f}}
:root[data-theme="dark"]{--bg:#0e2616;--ink:#d9ffd0;--edge:#0b3d1f;--card:#ffffff1f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif}
body{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
h1{margin:0;font-size:30px;font-weight:900}
.bar{display:flex;gap:12px;font-weight:600}
.bar span{background:var(--card);border-radius:14px;padding:4px 16px}
.bar b{font-weight:900;font-size:20px}
.wrap{position:relative;width:min(96vw,580px)}
canvas{width:100%;aspect-ratio:1;border:6px solid var(--edge);border-radius:20px;display:block;touch-action:none;box-shadow:0 6px 0 var(--edge)}
.msg{position:absolute;inset:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:#0b3d1fb0;color:#fff;border-radius:14px}
.msg.off{display:none}
.msg p{margin:0;font-size:22px;font-weight:900}
button{font:inherit;font-weight:900;background:var(--btn);color:var(--btnink);border:0;border-radius:16px;padding:8px 30px;font-size:20px;cursor:pointer;box-shadow:0 5px 0 var(--btnsh)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btnsh)}
button:focus-visible{outline:3px solid #e63946;outline-offset:2px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:10px;direction:ltr}
.pad button{padding:0;font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.ctl{display:flex;gap:22px;align-items:center}
#boost{width:84px;height:84px;border-radius:50%;padding:0;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:#e63946;color:#fff;box-shadow:0 5px 0 #9b1c12}
#boost small{font-size:13px;font-weight:900}
#boost.on{transform:translateY(4px);box-shadow:0 1px 0 #9b1c12;filter:brightness(1.15)}
.pop{position:absolute;left:50%;top:14%;font-weight:900;font-size:44px;color:#ffe14d;text-shadow:0 3px 0 #9b1c12,0 0 14px #000a;pointer-events:none;white-space:nowrap;animation:pop 1.1s ease-out forwards}
.pop.sm{font-size:26px;color:#fff;top:8%}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s;animation-delay:.8s}}
.pop.meat{color:#ff5a4d}
.pop.wx{top:auto;bottom:7%;font-size:22px;color:#fff}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{display:block;padding:0;position:fixed;inset:0}
h1{display:none}
.wrap{position:fixed;inset:0;width:auto}
canvas{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}
.msg{inset:0;border-radius:0;z-index:5}
.bar{position:fixed;top:0;left:0;right:0;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 10px);z-index:4;pointer-events:none}
.bar span{background:#0b3d1f99;color:#fff;backdrop-filter:blur(4px)}
.ctl{position:fixed;bottom:0;left:0;right:0;justify-content:space-between;padding:0 18px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:4;pointer-events:none}
.ctl>*{pointer-events:auto}
#boost,.pad button{opacity:.86}
.bar{flex-wrap:wrap}
#ttl{display:inline-block;margin-inline-start:8px;padding:0 10px;border-radius:10px;background:linear-gradient(#ffd54a,#ff9f1c);color:#5a3200;font-size:14px;font-weight:900;font-style:normal}
#ttl:empty{display:none}
.pulse{animation:ttlp .9s ease-out}
@keyframes ttlp{0%{transform:scale(.6);opacity:0}40%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
#boost{font-size:36px;line-height:1}
#stick{position:relative;width:150px;height:150px;border-radius:50%;background:radial-gradient(#ffffff3a,#ffffff14);border:3px solid #ffffff88;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;opacity:.92;backdrop-filter:blur(3px)}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffb703 60%,#c27a00);box-shadow:0 4px 0 #8a5400;transition:transform .09s;pointer-events:none}
#stick.drag #knob{transition:none}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;z-index:6;width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;line-height:1;background:#0b3d1fb3;color:#fff;box-shadow:none;border:2px solid #ffffff44;display:flex;align-items:center;justify-content:center}
#snd:active{transform:none;box-shadow:none}
.bar{padding-inline:58px}
</style>
</head>
<body>
<h1>🐍 لعبة الثعبان</h1>
<div class="bar"><span>النقاط: <b id="s">0</b></span><span>الطول: <b id="ln">3</b><i id="ttl"></i></span><span>الأفضل: <b id="b">0</b></span></div>
<button id="snd" aria-label="كل الأصوات">🔊</button>
<div class="wrap" id="w">
<div class="msg" id="m"><p id="mt">جاهز للمغامرة؟</p><button id="go">ابدأ</button></div>
</div>
<div class="ctl">
<button id="boost" aria-label="اضغط باستمرار للتسريع">⚡</button>
<div id="stick" role="application" aria-label="عصا التحكم"><div id="knob"></div></div>
</div>
<script>
const N=28,H=(N-1)/2,$=id=>document.getElementById(id);
const V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},O={u:'d',d:'u',l:'r',r:'l'};
let snake=[[14,14],[13,14],[12,14]],prev=snake.map(s=>s.slice()),dir='r',q=[],food=[20,14];
let score=0,best=0,running=false,last=0,step=170,boost=false,glow=0,bite=0,born=0,lt=0,mouth=0,dtG=.016,tNow=0,grow=0,glowRed=false,GC=[1,.8,.25],nextBlink=2,blinkP=-1;
try{best=+localStorage.getItem('snake-best')||0}catch(e){}
$('b').textContent=best;

/* ---------- المشهد ثلاثي الأبعاد ---------- */
const wrap=$('w'),R=new THREE.WebGLRenderer({antialias:true}),cv=R.domElement;
R.setPixelRatio(Math.min(devicePixelRatio||1,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
wrap.insertBefore(cv,wrap.firstChild);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,200);
cam.position.set(0,32,22);cam.lookAt(0,0,3);
let camK=1;
function size(){
  const w=Math.max(200,innerWidth||360),h=Math.max(300,innerHeight||640),asp=w/h;
  R.setSize(w,h,false);cam.aspect=asp;
  camK=asp<.77?.77/asp:1;
  const k=camK,tz=4*(k-1);
  cam.position.set(0,32*k,3+tz+19*k);cam.lookAt(0,0,3+tz);cam.updateProjectionMatrix();
}
size();addEventListener('resize',size);

const hemi=new THREE.HemisphereLight(0xffffff,0x88aa88,.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.7);
sun.position.set(-11,28,14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=sc.bottom=-34;sc.right=sc.top=34;sc.near=1;sc.far=100;
scene.add(sun);
const glowLight=new THREE.PointLight(0xffd166,0,10,2);scene.add(glowLight);

/* الأرضية: عشب غابة */
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const GS=32,gc=document.createElement('canvas');gc.width=gc.height=N*GS;
const tex=new THREE.CanvasTexture(gc);tex.anisotropy=4;
const gc2=document.createElement('canvas');gc2.width=gc2.height=256;
const tex2=new THREE.CanvasTexture(gc2);tex2.wrapS=tex2.wrapT=THREE.RepeatWrapping;tex2.repeat.set(26,26);tex2.anisotropy=4;
const outer=new THREE.Mesh(new THREE.PlaneGeometry(140,140),new THREE.MeshStandardMaterial({map:tex2,roughness:1}));
outer.rotation.x=-Math.PI/2;outer.position.y=-.02;outer.receiveShadow=true;scene.add(outer);
scene.background=new THREE.Color(0x2a6234);scene.fog=new THREE.Fog(0x2a6234,200,400);
const baseBg=new THREE.Color(),bgRain=new THREE.Color(),bgSnow=new THREE.Color();
function theme(){
  const d=matchMedia('(prefers-color-scheme:dark)').matches,g=gc.getContext('2d'),W=N*GS;seed=7;
  const L=d?-17:0,hs=(h,s,l)=>`hsl(${h},${s}%,${l+L}%)`;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){g.fillStyle=(i+j)%2?hs(100,50,44):hs(105,48,40);g.fillRect(i*GS,j*GS,GS,GS)}
  for(let k=0;k<140;k++){g.globalAlpha=.13;g.fillStyle=rnd()<.5?hs(90,45,28):hs(120,50,55);
    g.beginPath();g.ellipse(rnd()*W,rnd()*W,18+rnd()*40,12+rnd()*30,rnd()*3,0,7);g.fill()}
  g.globalAlpha=1;g.lineCap='round';g.lineWidth=1.6;
  for(let k=0;k<10200;k++){
    const x=rnd()*W,y=rnd()*W,h=5+rnd()*9;
    g.strokeStyle=hs(88+rnd()*40,55,26+rnd()*34);
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+(rnd()-.5)*5,y-h/2,x+(rnd()-.5)*9,y-h);g.stroke();
  }
  for(let k=0;k<52;k++){g.fillStyle=['#b5651d','#c98a2b','#8a4b14'][k%3];g.globalAlpha=.8;
    g.beginPath();g.ellipse(rnd()*W,rnd()*W,4,2.2,rnd()*3,0,7);g.fill()}
  g.globalAlpha=1;
  for(let k=0;k<90;k++){const x=rnd()*W,y=rnd()*W,c=['#ffffff','#ffd84d','#ff9ec4','#c9a0ff'][k%4];
    g.fillStyle=c;for(let p=0;p<5;p++){g.beginPath();g.arc(x+Math.cos(p*1.26)*3,y+Math.sin(p*1.26)*3,2.2,0,7);g.fill()}
    g.fillStyle='#f4a300';g.beginPath();g.arc(x,y,1.6,0,7);g.fill()}
  tex.needsUpdate=true;
  const h=gc2.getContext('2d');seed=11;
  h.fillStyle=d?'#173a21':'#3a8240';h.fillRect(0,0,256,256);
  for(let k=0;k<30;k++){h.globalAlpha=.16;h.fillStyle=rnd()<.5?(d?'#0f2a17':'#2a6a33'):(d?'#24502f':'#5aa352');
    h.beginPath();h.ellipse(rnd()*256,rnd()*256,14+rnd()*30,10+rnd()*22,rnd()*3,0,7);h.fill()}
  h.globalAlpha=1;h.lineCap='round';h.lineWidth=1.4;
  for(let k=0;k<1400;k++){const x=rnd()*256,y=rnd()*256,l=4+rnd()*8;
    h.strokeStyle=`hsl(${85+rnd()*45},${45+rnd()*20}%,${(d?12:24)+rnd()*(d?18:28)}%)`;
    h.beginPath();h.moveTo(x,y);h.lineTo(x+(rnd()-.5)*5,y-l);h.stroke()}
  for(let k=0;k<26;k++){h.fillStyle=['#8a4b14','#a8691f','#6b3a14'][k%3];h.globalAlpha=.75;
    h.beginPath();h.ellipse(rnd()*256,rnd()*256,3.5,2,rnd()*3,0,7);h.fill()}
  h.globalAlpha=1;tex2.needsUpdate=true;
  baseBg.set(d?0x0e2616:0x2a6234);bgRain.set(d?0x0b1511:0x4d5d57);bgSnow.set(d?0x1a2433:0xb5c6d2);
}
theme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(N,N),new THREE.MeshStandardMaterial({map:tex,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const _o=new THREE.Object3D(),_c=new THREE.Color();
const mk=(m,geo,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o};

/* دمج الهندسة في شبكات ثابتة (أسرع وأوثق من التنسيخ) */
const _v=new THREE.Vector3(),_n=new THREE.Vector3(),_nm=new THREE.Matrix3();
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const nonI=g=>g.index?g.toNonIndexed():g;
const newM=uv=>({p:[],n:[],c:[],u:uv?[]:null});
function put1(M,geo,x,y,z,sx,sy,sz,c,rx,ry,rz){
  _o.position.set(x,y,z);_o.rotation.set(rx||0,ry||0,rz||0);_o.scale.set(sx,sy,sz);_o.updateMatrix();
  const m4=_o.matrix,pa=geo.attributes.position,na=geo.attributes.normal,ua=geo.attributes.uv;
  _nm.getNormalMatrix(m4);
  for(let i=0;i<pa.count;i++){
    _v.fromBufferAttribute(pa,i).applyMatrix4(m4);M.p.push(_v.x,_v.y,_v.z);
    _n.fromBufferAttribute(na,i).applyMatrix3(_nm).normalize();M.n.push(_n.x,_n.y,_n.z);
    M.c.push(c.r,c.g,c.b);if(M.u)M.u.push(ua.getX(i),ua.getY(i));
  }
}
function meshOf(M,mat,shadow){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(M.p,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(M.n,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(M.c,3));
  if(M.u)g.setAttribute('uv',new THREE.Float32BufferAttribute(M.u,2));
  const o=new THREE.Mesh(g,mat);o.castShadow=shadow!==false;o.receiveShadow=true;o.frustumCulled=false;scene.add(o);return o;
}

/* إطار حجري: صفّان من الكتل غير المنتظمة وأبراج في الزوايا */
function stoneTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle='#cfcfca';g.fillRect(0,0,128,128);
  for(let k=0;k<1600;k++){const v=90+rnd()*150|0;g.fillStyle=`rgba(${v},${v},${v},.28)`;g.fillRect(rnd()*128,rnd()*128,1+rnd()*2.5,1+rnd()*2.5)}
  g.lineWidth=1;g.strokeStyle='rgba(60,60,60,.35)';
  for(let k=0;k<7;k++){let x=rnd()*128,y=rnd()*128;g.beginPath();g.moveTo(x,y);for(let i=0;i<4;i++){x+=(rnd()-.5)*30;y+=(rnd()-.5)*30;g.lineTo(x,y)}g.stroke()}
  g.lineWidth=3;g.strokeStyle='rgba(40,40,40,.25)';g.strokeRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}
const stoneM=new THREE.MeshStandardMaterial({map:stoneTexture(),vertexColors:true,roughness:.95,emissive:0xdde8ee,emissiveIntensity:0});
const boxG=nonI(new THREE.BoxGeometry(1,1,1)),Ms=newM(true),E=N/2+.55,span=N/2+1.2;
for(const sd of[[0,-1],[0,1],[1,-1],[1,1]])for(let c=0;c<2;c++){
  let cur=-span-(c?.55:0);const h=c?.34:.4,y=c?.4+h/2:h/2;
  while(cur<span){
    const l=.8+rnd()*.7,t=.9+(rnd()-.5)*.1,p=cur+l/2,r=(rnd()-.5)*.06;
    _c.setHSL(.09+rnd()*.05,.04+rnd()*.05,.52+rnd()*.26);if(rnd()<.14)_c.setHSL(.24,.3,.4+rnd()*.1);
    if(sd[0]==0)put1(Ms,boxG,p,y,sd[1]*E,l-.04,h,t,_c,0,r,0);else put1(Ms,boxG,sd[1]*E,y,p,t,h,l-.04,_c,0,r,0);
    cur+=l;
  }
}
for(const [a,b] of[[-1,-1],[1,-1],[-1,1],[1,1]]){
  _c.setHSL(.1,.05,.5);put1(Ms,boxG,a*(E+.3),.65,b*(E+.3),1.5,1.3,1.5,_c,0,.05*a*b,0);
  _c.setHSL(.1,.04,.72);put1(Ms,boxG,a*(E+.3),1.4,b*(E+.3),1.8,.2,1.8,_c,0,.05*a*b,0);
}
meshOf(Ms,stoneM,true);

/* غابة كثيفة: صنوبر وأشجار عريضة وبتولا وشجيرات وسرخس وأزهار وعشب وصخور وجذوع */
const trunkMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95,flatShading:true});
const leafMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.85,flatShading:true,emissive:0xd0e6ea,emissiveIntensity:0});
const grassMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.9,emissive:0xd0e6ea,emissiveIntensity:0,side:THREE.DoubleSide});
const rockMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95,flatShading:true,emissive:0xdde8ee,emissiveIntensity:0});
const tG0=new THREE.CylinderGeometry(.2,.36,1,7);tG0.translate(0,.5,0);const trunkG=nonI(tG0);
const cG0=new THREE.ConeGeometry(1,1,8);cG0.translate(0,.5,0);const coneG=nonI(cG0);
const gG0=new THREE.ConeGeometry(.05,.7,4);gG0.translate(0,.35,0);const grassG=nonI(gG0);
const fG0=new THREE.ConeGeometry(.1,1,4);fG0.translate(0,.5,0);const frondG=nonI(fG0);
const sG0=new THREE.ConeGeometry(.018,.5,4);sG0.translate(0,.25,0);const stemG=nonI(sG0);
const blobHi=nonI(new THREE.IcosahedronGeometry(1,1)),blobLo=nonI(new THREE.IcosahedronGeometry(1,0));
const rockG=nonI(new THREE.DodecahedronGeometry(1,0)),flowG=nonI(new THREE.SphereGeometry(.07,8,6));
const Mt=newM(),Mf=newM(),Mg=newM(),Mr=newM();
const put=(min,max)=>{let x,z;do{x=(rnd()*2-1)*max;z=(rnd()*2-1)*max}while(Math.max(Math.abs(x),Math.abs(z))<min);return[x,z]};
const cc=new THREE.Color(),tc=new THREE.Color(),TREES=[];
for(let n=0;n<16000&&TREES.length<380;n++){
  const[x,z]=put(N/2+5,40);
  if(TREES.some(t=>Math.hypot(t.x-x,t.z-z)<1.9))continue;
  const kind=rnd(),h=Math.max(Math.abs(x),Math.abs(z)),bg=h>27?blobLo:blobHi,s=.8+rnd()*.7;
  if(kind<.42){
    const th=1.6*s;TREES.push({x,z,th,s,kind:0,top:5.9*s});
    tc.setHSL(.07,.35,.2+rnd()*.06);put1(Mt,trunkG,x,0,z,s*.9,th,s*.9,tc,0,rnd()*6,0);
    for(let j=0;j<4;j++){cc.setHSL((125+rnd()*20)/360,.4+rnd()*.15,.17+rnd()*.07+j*.015);
      put1(Mf,coneG,x,th*.6+j*1.15*s,z,(1.9-.4*j)*s,2*s*(1-.08*j),(1.9-.4*j)*s,cc,0,rnd()*6,0)}
  }else if(kind<.85){
    const th=2.2*s;TREES.push({x,z,th,s,kind:1,top:th+2.8*s});
    tc.setHSL(.08,.3,.24+rnd()*.06);put1(Mt,trunkG,x,0,z,s,th,s,tc,0,rnd()*6,0);
    const au=rnd()<.12,col=()=>{if(au)cc.setHSL((25+rnd()*25)/360,.7,.45);else cc.setHSL((85+rnd()*35)/360,.45+rnd()*.15,.28+rnd()*.12);return cc};
    put1(Mf,bg,x,th+1.2*s,z,1.9*s*(.9+rnd()*.3),1.6*s,1.9*s*(.9+rnd()*.3),col());
    for(let b=0;b<3;b++){const a=rnd()*6.28;put1(Mf,bg,x+Math.cos(a)*1.1*s,th+.6*s+rnd()*.5,z+Math.sin(a)*1.1*s,1.3*s,1.1*s,1.3*s,col())}

  function thunder(){const d=rnd(.4,2.6),o={bus:amb};

  /* مناديات الغابة العشوائية */
  function wild(rA,sA){

  function call(k,pan,vf){

  function drum(pan,vf){const n=7+(Math.random()*5|0);for(let i=0;i<n;i++){nz({f:1100,q:2.5,dur:.025,vol:.07*vf,delay:i*.085,pan,bus:amb,send:.2});tone(700,{dur:.02,vol:.03*vf,delay:i*.085,pan,bus:amb,send:.1})}}
  function watch(dt,rA,sA){

  function update(dt,i){

    if(i.mouth>.55&&lastMouth<=.55&&i.run&&gate('inhale',700))nz({f:1200,to:2600,q:1.2,dur:.2,a:.06,vol:.05});lastMouth=i.mouth;
    if(i.tg&&!lastTong&&i.run&&Math.random()<.45&&gate('tongue',900))nz({type:'highpass',f:6800,dur:.05,vol:.022});lastTong=i.tg;

    }

  function setMode(m){

/* ---------- منطق اللعبة: حركة حرة بعصا تحكم تناظرية ---------- */
const BASE=5.4,TURN=4.2,TT=[[18,'حارسة الغابة'],[28,'الباسيليسك'],[40,'التنين الزاحف'],[55,'الهيدرا'],[75,'كوكولكان'],[100,'أبوفيس'],[130,'يورمونغاندر'],[170,'أوروبوروس']];
let sX=0,sZ=0,sHd=0,sLen=3,sGrow=0,trail=[],trailLen=0,boostK=1,lnShown=-1,ttIdx=-1;
const joy={x:0,z:0,id:null},keys={u:0,d:0,l:0,r:0};
function resetSnake(){
  sX=0;sZ=0;sHd=0;sLen=3;sGrow=0;trail=[];
  for(let i=0;i<=25;i++)trail.push([-i*.12,0]);
  trailLen=25*.12;
}
resetSnake();
function setBoost(b){if(b!==boost)SND.boost(b);boost=b;$('boost').classList.toggle('on',b)}
function addPts(n){score+=n;$('s').textContent=score;sGrow+=n*1.4}
function snakeNear(cx,cz,r){const x=cx-H,z=cz-H;for(let i=0;i<trail.length;i+=3){const p=trail[i];if(Math.hypot(p[0]-x,p[1]-z)<r)return true}return false}
function place(){let n=0;do{food=[Math.random()*N|0,Math.random()*N|0];n++}while(n<200&&snakeNear(food[0],food[1],1.4));born=performance.now()}
function start(){
  SND.start();sqReset();meatReset();rbReset();resetSnake();
  score=0;boostK=1;$('s').textContent=0;place();running=true;$('m').classList.add('off');
}
function over(why){
  SND.over(why,score>best);sqHide();meatHide();rbHide();
  running=false;
  if(score>best){best=score;$('b').textContent=best;try{localStorage.setItem('snake-best',best)}catch(e){}}
  $('mt').textContent='انتهت اللعبة! نقاطك: '+score+' — الطول: '+Math.round(sLen);$('go').textContent='العب مجددًا';
  $('m').classList.remove('off');
}
function move(dt){
  const v=BASE*(1+Math.min(score,60)*.01)*boostK,n=Math.max(1,Math.ceil(v*dt/.1)),h=dt/n;
  let ix=joy.x,iz=joy.z;
  if(Math.hypot(ix,iz)<.2){ix=keys.r-keys.l;iz=keys.d-keys.u}
  const steer=Math.hypot(ix,iz)>.2,ta=Math.atan2(iz,ix);
  for(let i=0;i<n;i++){
    if(steer){let d=ta-sHd;d=Math.atan2(Math.sin(d),Math.cos(d));sHd+=Math.max(-TURN,Math.min(TURN,d*7))*h}
    const l=trail[0];
    sX+=Math.cos(sHd)*v*h;sZ+=Math.sin(sHd)*v*h;
    trail.unshift([sX,sZ]);trailLen+=Math.hypot(sX-l[0],sZ-l[1]);
    if(Math.abs(sX)>13.7||Math.abs(sZ)>13.7)return over('wall');
  }
  if(sGrow>0){const g=Math.min(sGrow,3.2*dt);sGrow-=g;sLen+=g}
  while(trail.length>2){
    const a=trail[trail.length-1],b=trail[trail.length-2],sl=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(trailLen-sl>=sLen){trail.pop();trailLen-=sl}else break;
  }
  let acc=0;
  for(let i=1;i<trail.length;i+=2){
    const a=trail[i-1],b=trail[i];acc+=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(acc>2.4&&Math.hypot(b[0]-sX,b[1]-sZ)<.5)return over('self');
  }
  if(Math.hypot(sX-(food[0]-H),sZ-(food[1]-H))<.95){SND.apple();addPts(1);place();glow=1;glowRed=false;bite=1;burst(sX,sZ,Math.cos(sHd),Math.sin(sHd))}
  if(meat.on&&meat.ph!=='sink'&&Math.hypot(sX-(meat.x-H),sZ-(meat.z-H))<1.05)eatMeat();
}
function hud(){
  const L=Math.round(sLen);if(L!==lnShown){lnShown=L;$('ln').textContent=L}
  let k=-1;for(let i=0;i<TT.length;i++)if(sLen>=TT[i][0])k=i;
  if(k!==ttIdx){if(k>ttIdx&&k>=0)SND.title(k);ttIdx=k;const t=$('ttl');t.textContent=k<0?'':TT[k][1];t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse')}
}
function render(now){
  GC=glowRed?[1,.08,.05]:[1,.8,.25];
  const Q=build(trail),hp=Q[0];
  if(running){const hx=sX+H,hz=sZ+H;updateSquirrel(dtG,hx,hz);rbTimer(dtG);critUpdate(rbc,dtG,hx,hz);critUpdate(crA,dtG,hx,hz)}
  head.position.set(hp[0],0,hp[1]);head.rotation.y=-sHd+Math.sin(tNow*.007)*.06;
  /* الفم: يفتح عند الاقتراب من أي طعام وعند الأكل */
  const dx=Math.cos(sHd),dz=Math.sin(sHd),ax=food[0]-H-hp[0],az=food[1]-H-hp[1];
  const tg=[[food[0]-H,food[1]-H]];

  for(const c of[sq,rbc,crA])if(c.on&&c.x>=0&&c.x<=N-1&&c.z>=0&&c.z<=N-1)tg.push([c.x-H,c.z-H]);

  if(running)for(const p of tg){
    const qx=p[0]-hp[0],qz=p[1]-hp[1],qd=Math.hypot(qx,qz)||1;
    if((qx*dx+qz*dz)/qd>.35)prox=Math.max(prox,Math.max(0,Math.min(1,(5-qd)/2.5)));
  }

  J.rotation.z=-mouth*1.15;U.rotation.z=mouth*.42;head.rotation.z=mouth*.32;fangs.visible=fangsL.visible=mouth>.15;
  nextBlink-=dtG;
  if(nextBlink<=0&&blinkP<0){blinkP=0;nextBlink=Math.random()<.25?.35:1.8+Math.random()*3.2}
  if(blinkP>=0){blinkP+=dtG/.17;if(blinkP>=1)blinkP=-1}
  const bl=blinkP<0?0:Math.sin(blinkP*Math.PI),ph=head.rotation.y,cs=Math.cos(ph),sn=Math.sin(ph);
  const lx=ax*cs-az*sn,lz=ax*sn+az*cs,ll=Math.hypot(lx,lz)||1;

  const tqx=bt[0]-hp[0],tqz=bt[1]-hp[1],gw=Math.max(.3,Math.min(1,1.25-bd/14));

  for(const E of eyes){
    E.open.scale.y=Math.max(.05,1-bl*.95);E.open.visible=bl<.6;E.closed.visible=bl>=.6;
    E.g.scale.setScalar(1+mouth*.15);eyeGaze(E,tv,gw,dtG);E.pup.scale.set(1.25-.3*mouth,1,.3+.55*mouth);
  }
  for(const S of stars)if(S.l>0){S.l-=dtG*1.4;S.v.y-=9*dtG;S.m.position.addScaledVector(S.v,dtG);S.m.scale.setScalar(Math.max(.01,S.l));S.m.rotation.x+=dtG*6;S.m.rotation.y+=dtG*5;if(S.l<=0)S.m.visible=false}
  const s=(now%1800)/1800;
  tongue.visible=s<.3&&mouth<.12;tongue.scale.x=Math.max(.01,Math.sin(s/.3*Math.PI));
  /* وهج الأكل */
  glowM.visible=glow>.01;glowLight.position.set(hp[0],1.6,hp[1]);
  glowLight.color.setHex(glowRed?0xff2a1a:0xffd166);glowLight.intensity=glow*(glowRed?5:2.6);
  const rr=glowRed?glow:0,bm=bodyM.material;bm.emissive.setRGB(1,1-.85*rr,1-.9*rr);bm.emissiveIntensity=.3+rr*.5;
  if(running)updateMeat(dtG);animMeat(now);
  const a=Math.min(1,(now-born)/300),e=1-Math.pow(1-a,3);
  apple.position.set(food[0]-H,Math.sin(now/300)*.08,food[1]-H);
  apple.rotation.y=now/700;apple.scale.setScalar(Math.max(.01,e));
  R.render(scene,cam);
}
function loop(now){
  dtG=Math.min(.05,(now-lt)/1000||0);lt=now;tNow=now;glow=Math.max(0,glow-dtG*(glowRed?.5:.7));updateWeather(dtG);updateFauna(dtG);bite=Math.max(0,bite-dtG*2.6);
  boostK+=((boost?1.45:1)-boostK)*Math.min(1,dtG*8);
  if(running)move(dtG);
  hud();render(now);SND.update(dtG,{run:running,v:BASE*(1+Math.min(score,60)*.01)*boostK,bk:boostK,mouth,tg:tongue.visible,x:sX});requestAnimationFrame(loop);
}
$('go').onclick=start;
/* عصا التحكم التناظرية */
const stickEl=$('stick'),knob=$('knob');
function joyUpdate(e){
  const r=stickEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R2=r.width*.34;
  let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy);if(m>R2){dx*=R2/m;dy*=R2/m}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/R2;joy.z=dy/R2;
}
function joyEnd(){joy.id=null;joy.x=joy.z=0;knob.style.transform='translate(0,0)';stickEl.classList.remove('drag')}
stickEl.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;stickEl.setPointerCapture&&stickEl.setPointerCapture(e.pointerId);stickEl.classList.add('drag');joyUpdate(e)});
stickEl.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)joyUpdate(e)});
['pointerup','pointercancel'].forEach(n=>stickEl.addEventListener(n,e=>{if(e.pointerId===joy.id)joyEnd()}));
stickEl.addEventListener('contextmenu',e=>e.preventDefault());
const KM={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){e.preventDefault();keys[k]=1}if(e.code==='Space'){e.preventDefault();setBoost(true)}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0;if(e.code==='Space')setBoost(false)});
const bt=$('boost');
bt.addEventListener('pointerdown',e=>{e.preventDefault();bt.setPointerCapture&&bt.setPointerCapture(e.pointerId);setBoost(true)});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>bt.addEventListener(n,()=>setBoost(false)));
bt.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{setBoost(false);keys.u=keys.d=keys.l=keys.r=0});
born=performance.now();requestAnimationFrame(loop);
</script>
